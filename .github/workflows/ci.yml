name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # picker.py imports QtWidgets at module level, so pytest cannot even
      # collect its tests without the libraries PyQt6 links against. The
      # runner image ships none of them.
      - name: Install the system libraries PyQt6 needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv sync installs the dev dependency group, so a dependency added
      # to pyproject.toml reaches CI without editing this file.
      - name: Install package + dev deps
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run tests
        # no display on the runner; the tests build no widgets, but Qt still
        # wants a platform plugin the moment it is imported
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -v

  lint:
    name: pre-commit (ruff + markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run all hooks
        run: pre-commit run --all-files --show-diff-on-failure
