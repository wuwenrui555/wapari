[project]
name = "wapari"
version = "0.1.1"
description = "WapaRi: utils for napari viewer from Wenrui XD"
authors = [
    {name = "Wenrui Wu",email = "wuwenruiwwr@outlook.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imagecodecs>=2025.3.30",
    "ipykernel>=6.0",
    "matplotlib>=3.10.7",
    "napari>=0.8.0",
    "napari-ome-zarr>=0.10.0",
    "ome-zarr>=0.18.0",
    "pyqt5>=5.15.11",
    "zarr>=3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line-length already handled by formatter

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "napari-mcp>=0.1.0",
    "pytest>=9.1.1",
]

[tool.ruff.lint.per-file-ignores]
"demo.py" = ["E402"]  # notebook-style script with %% cells
