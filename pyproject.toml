[project]
name = "wapari"
version = "0.1.0"
description = "WapaRi: utils for napari viewer from Wenrui XD"
authors = [
    {name = "Wenrui Wu",email = "wuwenruiwwr@outlook.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
    "napari>=0.6.5",
    "pyqt5>=5.15.11",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
